<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F1E7">
<meta name="description" content="Qur'an Khatm — a calm Qur'an reading and listening companion with flexible completion schedules.">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/mushaf.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/mushaf.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Qur'an Khatm · القرآن الكريم</title>
<script>try{const t=localStorage.getItem('weeklyQuran:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<noscript>This app requires JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script>
function showBootError(error){
  console.error("Qur'an Khatm boot error:",error);
  const app=document.getElementById("app");
  if(!app)return;
  const message=error?.message||String(error);
  app.innerHTML='<div style="padding:32px;max-width:560px;margin:auto;font-family:system-ui,sans-serif;text-align:center"><h2>Qur\'an Khatm</h2><p>The reader encountered an error while loading.</p><p style="font-size:13px;opacity:.7;word-break:break-word">'+message.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</p><button onclick="location.reload()">Reload</button></div>';
}
window.addEventListener("error",e=>{
  const app=document.getElementById("app");
  if(app&&!app.innerHTML.trim()) showBootError(e.error||new Error(e.message));
});
window.addEventListener("unhandledrejection",e=>{
  const app=document.getElementById("app");
  if(app&&!app.innerHTML.trim()) showBootError(e.reason||new Error("Unhandled promise rejection"));
});
</script>
<script src="app.js?v=20261003-19" defer></script>
<script>
if("serviceWorker" in navigator) {
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js?v=20",{updateViaCache:"none"}).catch(()=>{});
  });
}
</script>
</body>
</html>
